<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14161c">
<title>Piano Coach</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<style>
  :root { --bg:#14161c; --panel:#1e212a; --text:#e8e9ee; --muted:#9aa0ad; --accent:#4f8cff; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text); font:14px system-ui, sans-serif; }
  body { display:flex; flex-direction:column; overflow:hidden; touch-action:none; }
  #bar { display:flex; flex-wrap:wrap; gap:6px; align-items:center; padding:6px 8px; background:var(--panel); }
  button, select, label.btn { background:#2b2f3b; color:var(--text); border:1px solid #3a3f4d; border-radius:8px; padding:8px 10px; font:inherit; min-height:40px; cursor:pointer; }
  button.on { background:var(--accent); border-color:var(--accent); }
  #file { display:none; }
  #name { color:var(--muted); max-width:30ch; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .grp { display:flex; gap:4px; align-items:center; }
  #pos { flex:1; min-width:120px; }
  #stage { position:relative; flex:1; min-height:0; }
  canvas { display:block; width:100%; height:100%; }
  #msg { position:absolute; inset:0; display:none; align-items:center; justify-content:center; background:#000a; padding:16px; }
  #msg.show { display:flex; }
  #msg > div { background:var(--panel); border-radius:12px; padding:18px; max-width:440px; width:100%; line-height:1.5; }
  #msg h2 { margin:0 0 8px; font-size:18px; }
  #status { color:var(--muted); font-size:12px; padding:2px 8px; background:var(--panel); min-height:18px; }
</style>
</head>
<body>
<div id="bar">
  <label class="btn" for="file">Open song</label>
  <input id="file" type="file" accept=".mid,.midi,audio/midi">
  <button id="demo">Demo</button>
  <span id="name">No song</span>
  <div class="grp">
    <button id="listen">▶ Listen</button>
    <button id="learn">🎹 Learn</button>
    <button id="stop">■</button>
  </div>
  <div class="grp">
    <label for="tempo">Tempo</label>
    <input id="tempo" type="range" min="25" max="100" step="5" value="100">
    <span id="tempoVal">100%</span>
  </div>
  <select id="hands" aria-label="Hands">
    <option value="both">Both hands</option>
    <option value="R">Right hand</option>
    <option value="L">Left hand</option>
  </select>
  <select id="input" aria-label="How you play">
    <option value="touch">Play by: touch</option>
    <option value="midi">Play by: MIDI keyboard</option>
    <option value="mic">Play by: microphone</option>
  </select>
  <div class="grp">
    <button id="setA" title="Loop start">A</button>
    <button id="setB" title="Loop end">B</button>
    <button id="clearLoop" title="Clear loop">✕</button>
  </div>
  <input id="pos" type="range" min="0" max="1000" value="0" aria-label="Position">
</div>
<div id="status"></div>
<div id="stage">
  <canvas id="roll"></canvas>
  <div id="msg"><div id="msgBody"></div></div>
</div>
<script src="vendor/Midi.js"></script>
<script src="matcher.js"></script>
<script src="app.js"></script>
</body>
</html>
